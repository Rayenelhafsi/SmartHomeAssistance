plugins {
    id "com.android.application"
    id "com.google.gms.google-services" 
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.main"
    compileSdk = 35
    ndkVersion "29.0.13113456"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.authfirebase"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

configurations.all {
    resolutionStrategy {
        force 'com.google.firebase:firebase-auth:21.0.8'
        force 'com.google.android.gms:play-services-auth:20.2.0'
        force 'com.google.android.gms:play-services-measurement:21.0.0'
        force 'com.google.firebase:firebase-analytics:21.0.0'
        force 'com.google.firebase:firebase-analytics-ktx:21.0.0'
        force 'com.google.firebase:firebase-auth-ktx:21.0.8'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:31.2.3')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-auth:21.0.8'
    implementation "com.google.android.gms:play-services-auth:20.2.0"
    implementation("com.google.android.gms:play-services-measurement") {
        version {
            strictly "21.0.0"
        }
        exclude group: "com.google.android.gms", module: "play-services-measurement-impl"
    }
}
